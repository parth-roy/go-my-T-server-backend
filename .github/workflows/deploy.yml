name: Deploy Server to DigitalOcean

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-deploy-validation:
    name: Pre-Mutation Build & Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Production TypeScript Build
        run: npm run build

      - name: Run All Contract & Architectural Tests
        run: npm test

  deploy:
    name: Deploy to Production
    needs: [pre-deploy-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || true
            cd /root/server
            git fetch origin
            git reset --hard origin/main
            npm ci || npm install
            npx prisma generate
            # 1. BUILD FIRST — if build fails, stop immediately with zero database mutation
            npm run build
            # 2. RUN PRE-MUTATION INTEGRITY GATE
            npm run pre-mutation-check
            # 3. APPLY VERIFIED MIGRATIONS (Safe production migration without db push)
            npx prisma migrate deploy
            # 4. RESTART PRODUCTION SERVER
            pm2 restart logistic-server --update-env || pm2 restart 0



